<div layer-name="header" style="display:flex;flex-direction:column;align-items:flex-start;gap:20px;width:100%;">

    <div layer-name="rule" style="width:32px;height:2px;background:#1A1A1A;flex-shrink:0;"></div>
    <div layer-name="CAPTURE TOOL" style="font-family:Inter,system-ui,sans-serif;font-size:12px;font-weight:700;letter-spacing:0.18em;line-height:16px;color:#1A1A1A;">CAPTURE TOOL</div>
  </div>

</div>
<div layer-name="Component 01" style="display:flex;flex-direction:column;align-items:flex-start;gap:28px;width:100%;">

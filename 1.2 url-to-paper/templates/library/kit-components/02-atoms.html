<div style="display:flex; flex-direction:column; align-items:flex-start; gap:20px; width:100%;">
  <div style="font-family:{{theme.sans}}; font-size:12px; font-weight:600; letter-spacing:0.14em; color:{{theme.muted}};">ATOMS</div>
  <div style="display:flex; flex-wrap:wrap; gap:20px; width:100%;">
    {{#each atoms}}
    <div style="display:flex; flex-direction:column; gap:10px; width:260px;">
      <div style="width:260px; height:140px; background:{{theme.surfaceAlt}}; border:1px solid {{theme.border}};"></div>
      <div style="font-family:{{theme.sans}}; font-size:14px; font-weight:500; color:{{theme.ink}};">{{.name}}</div>
    </div>
    {{/each}}
  </div>
</div>

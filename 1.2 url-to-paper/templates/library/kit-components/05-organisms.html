<div style="display:flex; flex-direction:column; align-items:flex-start; gap:20px; width:100%;">
  <div style="font-family:{{theme.sans}}; font-size:12px; font-weight:600; letter-spacing:0.14em; color:{{theme.muted}};">ORGANISMS</div>

  <div style="display:flex; flex-wrap:wrap; gap:20px; width:100%;">
    {{#each cards}}
    <div style="display:flex; flex-direction:column; gap:10px; width:340px;">
      <div style="width:340px; height:400px; background:{{theme.surfaceAlt}}; border:1px solid {{theme.border}};"></div>
      <div style="font-family:{{theme.sans}}; font-size:14px; font-weight:500; color:{{theme.ink}};">{{.name}}</div>
    </div>
    {{/each}}
  </div>

  <div style="display:flex; flex-direction:column; gap:20px; width:100%;">
    {{#each regions}}
    <div style="display:flex; flex-direction:column; gap:10px; width:100%;">
      <div style="width:100%; height:{{.h}}px; background:{{theme.surfaceAlt}}; border:1px solid {{theme.border}};"></div>
      <div style="font-family:{{theme.sans}}; font-size:14px; font-weight:500; color:{{theme.ink}};">{{.name}}</div>
    </div>
    {{/each}}
  </div>
</div>

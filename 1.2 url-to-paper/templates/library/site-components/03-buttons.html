<div style="display:flex; flex-direction:column; align-items:flex-start; gap:20px; width:100%;">
  <div style="font-family:{{theme.sans}}; font-size:12px; font-weight:600; letter-spacing:0.14em; color:{{theme.muted}};">BUTTONS</div>
  <div style="font-family:{{theme.sans}}; font-size:13px; line-height:20px; color:{{theme.muted}}; width:760px;">Default is the live captured node. Hover is an empty slot — a static DOM capture cannot record hover, so these are filled in by hand.</div>
  <div style="display:flex; flex-wrap:wrap; align-items:flex-start; gap:24px; width:100%;">
    {{#each buttons}}
    <div style="display:flex; flex-direction:column; gap:10px; width:{{.bw}}px; flex:none;">
      <div style="display:flex; gap:12px;">
        <div style="display:flex; flex-direction:column; gap:8px; width:{{.cw}}px; flex:none;">
          <div style="width:{{.cw}}px; height:{{.ch}}px; background:{{.bg}}; border:1px solid {{theme.border}}; display:flex; align-items:center; justify-content:center; flex:none;">
            <x-paper-clone node-id="{{.id}}" style="width:{{.w}}px; height:{{.h}}px; flex:none;" />
          </div>
          <div style="font-family:{{theme.sans}}; font-size:12px; color:{{theme.muted}};">default</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px; width:{{.cw}}px; flex:none;">
          <div style="width:{{.cw}}px; height:{{.ch}}px; background:{{theme.surfaceAlt}}; border:1px dashed {{theme.borderStrong}}; flex:none;"></div>
          <div style="font-family:{{theme.sans}}; font-size:12px; color:{{theme.muted}};">hover</div>
        </div>
      </div>
      <div style="font-family:{{theme.sans}}; font-size:14px; font-weight:500; color:{{theme.ink}};">{{.name}}</div>
    </div>
    {{/each}}
  </div>
</div>

<div style="display:flex; flex-direction:column; align-items:flex-start; gap:var(--spacing-7); width:100%;">
  <div style="display:flex; align-items:baseline; gap:var(--spacing-4); width:100%; padding-bottom:var(--spacing-4); border-bottom:1px solid {{theme.border}};">
    <div style="font-family:{{theme.display}}; font-size:var(--text-4xl); font-weight:600; line-height:1.1; color:{{theme.ink}};">Spacing</div>
    <div style="font-family:{{theme.sans}}; font-size:var(--text-xs); font-weight:600; letter-spacing:0.14em; color:{{theme.muted}};">TAILWIND DEFAULT</div>
  </div>

  {{#each spacing}}
  <div style="display:flex; align-items:center; gap:var(--spacing-6); width:1072px; padding:var(--spacing-2-5) 0; border-bottom:1px solid {{theme.border}};">
    <div style="font-family:{{theme.mono}}; font-size:var(--text-sm); color:{{theme.ink}}; width:170px; flex:none;">{{.name}}</div>
    <div style="font-family:{{theme.mono}}; font-size:var(--text-sm); color:{{theme.body}}; width:60px; flex:none;">{{.value}}</div>
    <div style="width:240px; height:var(--spacing-3-5); background:{{theme.surfaceAlt}}; flex:none; display:flex; align-items:center;">
      <div style="width:{{.cssVar}}; height:var(--spacing-3-5); background:{{theme.ink}};"></div>
    </div>
    <div style="font-family:{{theme.sans}}; font-size:var(--text-xs); color:{{theme.muted}};">{{.step}}</div>
  </div>
  {{/each}}
</div>
